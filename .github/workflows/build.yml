name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  extract-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: get-version
        run: |
          VERSION=$(grep '^const AppVersion' src/version.go | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: extract-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      - run: npm ci
        working-directory: frontend
      - name: Build macOS
        run: wails build -version ${{ needs.extract-version.outputs.version }} -platform darwin/universal
      - uses: actions/upload-artifact@v4
        with:
          name: sort-pdf-macos
          path: build/bin/sort-pdf.app

  build-windows:
    needs: extract-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      - run: npm ci
        working-directory: frontend
      - name: Build Windows
        run: wails build -version ${{ needs.extract-version.outputs.version }} -platform windows/amd64
      - uses: actions/upload-artifact@v4
        with:
          name: sort-pdf-windows
          path: build/bin/sort-pdf.exe

  build-linux:
    needs: extract-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      - run: npm ci
        working-directory: frontend
      - name: Build Linux
        run: wails build -version ${{ needs.extract-version.outputs.version }} -platform linux/amd64
      - uses: actions/upload-artifact@v4
        with:
          name: sort-pdf-linux
          path: build/bin/sort-pdf

  release:
    needs: [extract-version, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: |
          cd artifacts
          mv sort-pdf-macos sort-pdf-macos.app
          zip -r sort-pdf-macos.zip sort-pdf-macos.app
          mv sort-pdf-windows sort-pdf-windows.exe
          zip sort-pdf-windows.zip sort-pdf-windows.exe
          mv sort-pdf-linux sort-pdf-linux
          chmod +x sort-pdf-linux
          tar czf sort-pdf-linux.tar.gz sort-pdf-linux
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.extract-version.outputs.version }}
          files: |
            artifacts/sort-pdf-macos.zip
            artifacts/sort-pdf-windows.zip
            artifacts/sort-pdf-linux.tar.gz
