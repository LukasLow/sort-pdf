name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  extract-version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: get-version
        shell: bash
        run: |
          VERSION=$(grep '^const AppVersion' src/version.go | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: extract-version

    strategy:
      fail-fast: false

      matrix:
        include:
          - name: macos-universal
            os: macos-latest
            platform: darwin/universal
            artifact-name: sort-pdf-macos-universal
            artifact-path: build/bin/sort-pdf.app
            artifact-ext: .app
            system-deps: ""
            wails-tags: ""
            is-macos: true

          - name: windows-amd64
            os: windows-latest
            platform: windows/amd64
            artifact-name: sort-pdf-windows-amd64
            artifact-path: build/bin/sort-pdf.exe
            artifact-ext: .exe
            system-deps: ""
            wails-tags: ""
            is-macos: false

          - name: linux-amd64
            os: ubuntu-22.04
            platform: linux/amd64
            artifact-name: sort-pdf-linux-amd64
            artifact-path: build/bin/sort-pdf
            artifact-ext: ""
            system-deps: |
              sudo apt-get update
              sudo apt-get install -y \
                build-essential \
                pkg-config \
                libgtk-3-dev \
                libwebkit2gtk-4.0-dev
            wails-tags: ""
            is-macos: false



    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        if: matrix.system-deps != ''
        shell: bash
        run: |
          ${{ matrix.system-deps }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Install Wails
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install frontend dependencies
        working-directory: frontend
        shell: bash
        run: npm ci

      - name: Set version in wails.json
        shell: bash
        run: |
          VERSION=$(grep '^const AppVersion' src/version.go | sed 's/.*"\(.*\)".*/\1/')

          if [ "${{ matrix.is-macos }}" = "true" ]; then
            sed -i "" "s/\"productVersion\": \".*\"/\"productVersion\": \"$VERSION\"/" wails.json
          else
            sed -i "s/\"productVersion\": \".*\"/\"productVersion\": \"$VERSION\"/" wails.json
          fi

      - name: Build
        shell: bash
        run: |
          wails build \
            -clean \
            -platform ${{ matrix.platform }} \
            ${{ matrix.wails-tags != '' && format('-tags {0}', matrix.wails-tags) || '' }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}

  release:
    needs:
      - extract-version
      - build

    if: startsWith(github.ref, 'refs/tags/')

    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package artifacts
        shell: bash
        run: |
          cd artifacts

          ls -la */

          for d in */; do
            name=${d%/}

            case $name in
              *macos*)
                cd "$d"
                zip -r "../$name.zip" .
                cd ..
                ;;

              *windows*)
                cd "$d"
                zip "../$name.zip" *
                cd ..
                ;;

              *linux*)
                cd "$d"
                tar czf "../$name.tar.gz" *
                cd ..
                ;;
            esac
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.extract-version.outputs.version }}
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
